<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animações do carrossel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --titulo: #434a50;
    --azul-300: #84c4f1;
    --verde: #3ecf8e;
    --ease: cubic-bezier(.22, 1, .36, 1);   /* saída suave, igual ao ease-out dos vídeos de referência */
    --slide-ms: 5000;                        /* cada cena dura 5s (mantenha igual ao SLIDE_MS no script) */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #ebeee0;
    font-family: "Outfit", system-ui, sans-serif;
    color: var(--titulo);
  }

  /* ---------- carrossel vertical ---------- */
  .carousel {
    --scale: 1;
    position: relative;
    width: calc(602px * var(--scale));
    height: calc(704px * var(--scale));
    border-radius: calc(26px * var(--scale));
    overflow: hidden;
  }
  .track {
    height: 100%;
    transition: transform .8s var(--ease);
  }
  .slide { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* palco fixo 602x704 (tamanho do frame no Figma), escalado pelo carrossel */
  .stage {
    position: absolute; left: 0; top: 0;
    width: 602px; height: 704px;
    transform: scale(var(--scale)); transform-origin: 0 0;
    overflow: hidden;
    border-radius: 26px;
    background: radial-gradient(120% 120% at 100% 0%, #6f91b5 0%, #55799f 28%, #2f5a82 58%, #123f66 82%, #082f50 100%);
  }
  /* fundo ESTÁTICO: nunca recebe animação */
  .stage .bg, .stage .photo { position: absolute; max-width: none; pointer-events: none; }
  .stage .bg { left: -13px; top: 0; width: 629px; height: 1117px; object-fit: cover; opacity: .6; }
  .stage .photo { object-fit: cover; }

  /* ---------- entrada dos elementos ---------- */
  .in {
    opacity: 0;
    transform: translateY(var(--y, 12px));
  }
  .slide.play .in {
    animation: enter .7s var(--ease) var(--d, 0s) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(var(--y, 12px)); }
    to   { opacity: 1; transform: none; }
  }
  .slide.play .in.pop { animation-name: pop; }
  @keyframes pop {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: none; }
  }
  .slide.play .in.from-left { animation-name: enter-left; }
  @keyframes enter-left {
    from { opacity: 0; transform: translateX(-16px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- cena 1: perfil corporal ---------- */
  .sizes { position: absolute; left: 49.5px; top: 187px; width: 134.8px; }
  .size-btn {
    position: absolute; left: 0; width: 134.8px; height: 56.8px;
    display: grid; place-items: center;
    border: 1.37px solid #fff; border-radius: 5.5px;
    background: linear-gradient(180deg, rgba(250,250,250,.8), rgba(255,255,255,.8) 41.7%);
    box-shadow: 0 24px 66px rgba(49,37,105,.16);
    font-size: 27.3px; font-weight: 400;
  }
  .size-btn.sel { border-color: var(--azul-300); font-weight: 600; }
  .size-btn .check { position: absolute; right: -4px; top: -10px; width: 23.7px; height: 23.7px; }

  .glass {
    position: absolute;
    background: rgba(255,255,255,.8);
    border-radius: 13px;
    box-shadow: 0 12.8px 35px rgba(49,37,105,.16);
    backdrop-filter: blur(6px);
  }
  .measures { left: 245.5px; top: 447px; width: 306px; padding: 26px 20px; display: grid; gap: 6px; }
  .measure { display: flex; align-items: center; justify-content: space-between; }
  .measure .lbl { width: 42px; font-size: 12px; font-weight: 500; }
  .measure .rail { position: relative; width: 132px; height: 16px; }
  .measure .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; border-radius: 2px; background: rgba(67,74,80,.25); }
  .measure .rail i {
    position: absolute; top: 2px; left: var(--v); width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: #fff; border: 1.5px solid var(--azul-300);
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .slide.play .measure .rail i { animation: slide-thumb 1s var(--ease) var(--d, 0s) both; }
  @keyframes slide-thumb { from { left: 8%; } to { left: var(--v); } }
  .measure .val { display: flex; align-items: center; gap: 3px; width: 56px; justify-content: space-between; }
  .measure .num {
    width: 36px; height: 26px; display: grid; place-items: center;
    background: #fff; border: .75px solid var(--azul-300); border-radius: 2.3px;
    font-size: 18px; font-weight: 500;
  }
  .measure .unit { font-size: 12px; }

  /* ---------- cena 2: tamanho certo ---------- */
  .size-card {
    position: absolute; left: 41px; top: 122px; width: 115.7px; height: 115.7px;
    display: grid; place-items: center;
    border: 1.4px solid #f4f4f4; border-radius: 11.3px;
    background: linear-gradient(0deg, rgba(255,255,255,.2) 18.75%, rgba(250,250,250,.2) 65.6%);
    box-shadow: 0 5.6px 5.6px rgba(0,0,0,.13);
    font-size: 66px; font-weight: 600; color: #fff;
  }
  .size-card .check { position: absolute; right: -8px; top: -8px; width: 29.6px; height: 29.6px; }
  .adjust { right: 46px; bottom: 59px; padding: 26px 20px; width: 246px; background: rgba(255,255,255,.7); display: grid; gap: 6px; }
  .adjust .row { display: grid; gap: 8px; justify-items: center; }
  .adjust .row p { margin: 0; font-size: 14px; font-weight: 500; }
  .adjust .ctl { display: flex; gap: 10px; align-items: center; width: 206px; }
  .adjust .btn {
    width: 40px; height: 40px; display: grid; place-items: center; flex: none;
    background: #fff; border: .75px solid var(--azul-300); border-radius: 2.3px;
  }
  .adjust .rail { position: relative; flex: 1; height: 11px; }
  .adjust .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: rgba(67,74,80,.5); }
  .adjust .rail i { position: absolute; top: 0; left: var(--v); width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #fff; border: 1.5px solid var(--titulo); }
  .slide.play .adjust .rail i { animation: slide-thumb 1s var(--ease) var(--d, 0s) both; }

  /* ---------- cena 3: vendas ---------- */
  .chart { left: 54.5px; top: 62px; width: 494px; padding: 21px 16px; border-radius: 10.5px; background: rgba(255,255,255,.8); overflow: hidden; }
  .chart svg { display: block; width: 462px; height: 170px; overflow: visible; }
  .chart .grid line { stroke: rgba(67,74,80,.18); stroke-width: .8; }
  .chart .mes { font: 500 8.4px "Outfit", sans-serif; fill: rgba(67,74,80,.8); }
  .chart .line { fill: none; stroke: #4299d7; stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .chart .area { fill: url(#areaGrad); opacity: 0; }
  .chart .dot { fill: #fff; stroke: #4299d7; stroke-width: 1.4; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .chart .tag rect { fill: #1c2a3a; }
  .chart .tag text { font: 700 7.2px Arial, sans-serif; fill: #fff; text-anchor: middle; }
  .chart .tag { opacity: 0; }
  .slide.play .chart .line { animation: draw 2.2s cubic-bezier(.45, 0, .2, 1) .9s forwards; }
  .slide.play .chart .area { animation: fade 1s ease-out 2.2s forwards; }
  .slide.play .chart .dot  { animation: dot-in .45s var(--ease) var(--d) forwards; }
  .slide.play .chart .tag  { animation: fade .5s ease-out var(--d) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes dot-in { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }

  .notif {
    position: absolute; display: flex; align-items: center; gap: 9px;
    padding: 8px 12px; border-radius: 13px;
    background: rgba(255,255,255,.6);
    box-shadow: 0 12.8px 35px rgba(49,37,105,.16);
    backdrop-filter: blur(6px);
    font-size: 18px; font-weight: 500; white-space: nowrap;
  }
  .notif svg { width: 31px; height: 31px; flex: none; }

  /* ---------- cena 4: celular ---------- */
  .phone { left: -70px; top: 27px; width: 701px; height: 844px; object-fit: contain; }

  /* ---------- respeita quem prefere menos movimento ---------- */
  @media (prefers-reduced-motion: reduce) {
    .in { opacity: 1; transform: none; }
    .slide.play .in, .slide.play .measure .rail i, .slide.play .adjust .rail i { animation: none; }
    .chart .line { stroke-dashoffset: 0; } .chart .area, .chart .dot, .chart .tag { opacity: 1; }
    .slide.play .chart .line, .slide.play .chart .area, .slide.play .chart .dot, .slide.play .chart .tag { animation: none; }
    .track { transition: none; }
  }
</style>
</head>
<body>

<!-- Símbolos reutilizados -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3ecf8e" stroke="#fff" stroke-width="1.6"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ico-sizebay" viewBox="0 0 31 31"><rect width="31" height="31" rx="8" fill="#d2ecff"/><path d="M21 11.2c-1.2-1.4-3-2.1-5.2-2.1-3 0-5 1.5-5 3.7 0 2 1.4 3 4.4 3.7 2 .5 2.6.9 2.6 1.6 0 .8-.8 1.3-2 1.3-1.4 0-2.5-.6-3.4-1.7l-2.2 2c1.2 1.6 3.2 2.6 5.5 2.6 3.1 0 5.3-1.6 5.3-4 0-2-1.3-3.1-4.4-3.8-1.9-.4-2.5-.8-2.5-1.5 0-.7.7-1.2 1.8-1.2 1 0 1.9.4 2.7 1.3z" fill="#434a50"/></symbol>
  </defs>
</svg>

<main class="carousel" id="carousel" aria-roledescription="carrossel" aria-label="Provador Virtual">
  <div class="track" id="track">

    <!-- 1 · PERFIL CORPORAL -->
    <section class="slide" aria-label="Perfil corporal">
      <div class="stage">
        <img class="bg" src="assets/bg.png" alt="" onerror="this.remove()">
        <img class="photo" src="assets/cena-1.png" alt="" onerror="this.remove()" style="left:-193.5px;top:-30px;width:1024px;height:764px">

        <div class="sizes">
          <div class="size-btn in" style="top:0;--d:.2s">PP</div>
          <div class="size-btn sel in" style="top:65.6px;--d:.4s">P<svg class="check in pop" style="--d:1.0s"><use href="#ico-check"/></svg></div>
          <div class="size-btn in" style="top:131.2px;--d:.6s">M</div>
        </div>

        <div class="glass measures in" style="--d:.9s;--y:16px">
          <div class="measure"><span class="lbl">Busto</span><span class="rail" style="--v:62%;--d:1.4s"><i></i></span><span class="val"><span class="num">81</span><span class="unit">cm</span></span></div>
          <div class="measure"><span class="lbl">Cintura</span><span class="rail" style="--v:42%;--d:1.6s"><i></i></span><span class="val"><span class="num">69</span><span class="unit">cm</span></span></div>
          <div class="measure"><span class="lbl">Quadril</span><span class="rail" style="--v:32%;--d:1.8s"><i></i></span><span class="val"><span class="num">95</span><span class="unit">cm</span></span></div>
        </div>
      </div>
    </section>

    <!-- 2 · TAMANHO CERTO -->
    <section class="slide" aria-label="Tamanho certo">
      <div class="stage">
        <img class="bg" src="assets/bg.png" alt="" onerror="this.remove()">
        <img class="photo" src="assets/cena-2.png" alt="" onerror="this.remove()" style="left:-7px;top:32px;width:634px;height:789px">

        <div class="size-card in" style="--d:.3s;--y:12px">M<svg class="check in pop" style="--d:1.1s"><use href="#ico-check"/></svg></div>

        <div class="glass adjust in" style="--d:.9s;--y:16px">
          <div class="row">
            <p>Cintura</p>
            <div class="ctl"><span class="btn"><svg width="12" height="2" viewBox="0 0 12 2"><path d="M0 1h12" stroke="#434a50" stroke-width="1.4"/></svg></span><span class="rail" style="--v:45%;--d:1.4s"><i></i></span><span class="btn"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M0 6h12M6 0v12" stroke="#434a50" stroke-width="1.4"/></svg></span></div>
          </div>
          <div class="row">
            <p>Quadril</p>
            <div class="ctl"><span class="btn"><svg width="12" height="2" viewBox="0 0 12 2"><path d="M0 1h12" stroke="#434a50" stroke-width="1.4"/></svg></span><span class="rail" style="--v:55%;--d:1.6s"><i></i></span><span class="btn"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M0 6h12M6 0v12" stroke="#434a50" stroke-width="1.4"/></svg></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 3 · VENDAS -->
    <section class="slide" aria-label="Vendas">
      <div class="stage">
        <img class="bg" src="assets/bg.png" alt="" onerror="this.remove()">
        <img class="photo" src="assets/cena-3.png" alt="" onerror="this.remove()" style="left:-13px;top:-17px;width:688px;height:918px;transform:scaleX(-1)">

        <div class="glass chart in" style="--d:.2s;--y:16px">
          <svg viewBox="0 0 462 170" aria-hidden="true">
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4299d7" stop-opacity=".28"/><stop offset="1" stop-color="#4299d7" stop-opacity="0"/></linearGradient>
            </defs>
            <g class="grid">
              <line x1="12" x2="451" y1="6.4" y2="6.4"/><line x1="12" x2="451" y1="42.6" y2="42.6"/><line x1="12" x2="451" y1="78.8" y2="78.8"/><line x1="12" x2="451" y1="115" y2="115"/><line x1="12" x2="451" y1="151.2" y2="151.2"/>
            </g>
            <g class="meses">
              <text class="mes" x="16" y="166">Jan</text><text class="mes" x="53" y="166">Feb</text><text class="mes" x="90" y="166">Mar</text><text class="mes" x="127" y="166">Apr</text><text class="mes" x="163" y="166">May</text><text class="mes" x="201" y="166">Jun</text><text class="mes" x="239" y="166">Jul</text><text class="mes" x="274" y="166">Aug</text><text class="mes" x="312" y="166">Sep</text><text class="mes" x="349" y="166">Oct</text><text class="mes" x="385" y="166">Nov</text><text class="mes" x="423" y="166">Dec</text>
            </g>
            <path class="area" d="M19.6 136.8 L93.6 115 L167.6 100.6 L241.6 71.6 L315.7 57.1 L389.7 28.2 L426.7 20.1 L426.7 151.2 L19.6 151.2 Z"/>
            <path class="line" pathLength="1" d="M19.6 136.8 L93.6 115 L167.6 100.6 L241.6 71.6 L315.7 57.1 L389.7 28.2 L426.7 20.1"/>
            <circle class="dot" style="--d:1.2s" cx="19.6"  cy="136.8" r="3.6"/>
            <circle class="dot" style="--d:1.5s" cx="93.6"  cy="115"   r="3.6"/>
            <circle class="dot" style="--d:1.8s" cx="167.6" cy="100.6" r="3.6"/>
            <circle class="dot" style="--d:2.1s" cx="241.6" cy="71.6"  r="3.6"/>
            <circle class="dot" style="--d:2.4s" cx="315.7" cy="57.1"  r="3.6"/>
            <circle class="dot" style="--d:2.7s" cx="389.7" cy="28.2"  r="3.6"/>
            <circle class="dot" style="--d:2.9s" cx="426.7" cy="20.1"  r="3.6"/>
            <g class="tag" style="--d:2.3s"><rect x="229.5" y="48" width="32.2" height="13.7" rx="2"/><text x="245.6" y="57.6">2.1K</text></g>
            <g class="tag" style="--d:3.1s"><rect x="410.6" y="-3" width="32.2" height="13.7" rx="2"/><text x="426.7" y="6.6">2.8K</text></g>
          </svg>
        </div>

        <div class="notif in" style="left:75.5px;top:419px;--d:2.4s;--y:16px"><svg><use href="#ico-sizebay"/></svg>Você tem uma nova venda</div>
        <div class="notif in" style="left:51.5px;top:476px;--d:3.2s;--y:16px"><svg><use href="#ico-sizebay"/></svg>Você tem uma nova venda</div>
      </div>
    </section>

    <!-- 4 · CELULAR / TRY-ON -->
    <section class="slide" aria-label="Provador no celular">
      <div class="stage">
        <img class="bg" src="assets/bg.png" alt="" onerror="this.remove()">
        <img class="photo phone in" src="assets/cena-4.png" alt="" onerror="this.remove()" style="--d:.2s;--y:16px">
      </div>
    </section>

  </div>
</main>

<script>
(() => {
  const SLIDE_MS = 5000;                       // duração de cada cena
  const carousel = document.getElementById('carousel');
  const track = document.getElementById('track');
  const slides = [...track.children];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, timer;

  // escala o palco 602x704 para caber na janela
  const fit = () => {
    const s = Math.min(1, (innerWidth - 32) / 602, (innerHeight - 32) / 704);
    carousel.style.setProperty('--scale', s);
  };
  addEventListener('resize', fit); fit();

  const show = n => {
    i = (n + slides.length) % slides.length;
    track.style.transform = `translateY(${-i * 100}%)`;
    slides.forEach((s, k) => s.classList.toggle('play', k === i));
    // reinicia as animações da cena ativa
    const s = slides[i]; s.classList.remove('play'); void s.offsetWidth; s.classList.add('play');
  };
  const start = () => { clearInterval(timer); timer = setInterval(() => show(i + 1), SLIDE_MS); };

  // cada cena também pode ser tocada isoladamente: animacoes-carrossel.html#2
  const hash = parseInt(location.hash.slice(1), 10);
  show(hash > 0 ? hash - 1 : 0);
  if (!(hash > 0)) start();                    // com #N a cena fica em loop abaixo
  else timer = setInterval(() => show(i), SLIDE_MS);

  // pausa quando a aba fica oculta
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : (hash > 0 ? (timer = setInterval(() => show(i), SLIDE_MS)) : start()));
})();
</script>
</body>
</html>
